name: Grading Runner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  grade:
    name: Autograder & CI Verification
    runs-on: ubuntu-latest
    env:
      AGY_OFFLINE_MODE: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (bats-core, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema pre-commit

      - name: Configure Mock CLI Binary
        run: |
          chmod +x mock-bin/agy
          echo "$GITHUB_WORKSPACE/mock-bin" >> $GITHUB_PATH

      - name: Verify Offline & Headless CLI Integrity
        run: |
          agy --version --json | jq .
          agy auth --headless --json | jq .
          agy run --headless --json | jq .
          agy task --headless --json | jq .

      - name: Run Bats Tests Across Track Directories
        run: |
          echo "=== Scanning for BATS test suites ==="
          BATS_FILES=$(find . -type f -name "*.bats" ! -path "*/.*" 2>/dev/null | sort || true)
          if [ -n "$BATS_FILES" ]; then
            echo "Running BATS on discovered test files:"
            echo "$BATS_FILES"
            bats $BATS_FILES
          else
            echo "No BATS test files found in repository."
          fi

      - name: Run Pytest Across Track Directories
        run: |
          echo "=== Scanning for Pytest suites ==="
          PYTEST_FILES=$(find . -type f -name "test_*.py" ! -path "*/.*" 2>/dev/null | sort || true)
          if [ -n "$PYTEST_FILES" ]; then
            echo "Running Pytest across discovered suites:"
            pytest -v
          else
            echo "No pytest test files found in repository."
          fi
